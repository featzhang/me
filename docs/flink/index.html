<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flink PR Todo - FeatZhang</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --failure: #f85149;
            --success: #3fb950;
            --warning: #d29922;
            --tag-bg: #21262d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent), #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: var(--text-muted); font-size: 1.1em; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .stat-card .number { font-size: 2.5em; font-weight: bold; margin-bottom: 8px; }
        .stat-card.open .number { color: var(--accent); }
        .stat-card.action .number { color: var(--failure); }
        .stat-card.success .number { color: var(--success); }
        .stat-card .label { color: var(--text-muted); font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }

        .section { margin-bottom: 40px; }
        .section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section h2 .badge {
            background: var(--failure);
            color: white;
            font-size: 0.6em;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .pr-grid { display: grid; gap: 16px; }

        .pr-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
        }
        .pr-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(88, 166, 255, 0.1); }

        .pr-card .status-icon {
            font-size: 1.5em;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .pr-card.failure .status-icon { color: var(--failure); }
        .pr-card.changes .status-icon { color: var(--warning); }

        .pr-content { flex: 1; min-width: 0; }

        .pr-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .pr-number {
            font-family: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
            font-size: 0.85em;
            background: var(--tag-bg);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent);
        }
        .pr-title {
            font-size: 1.1em;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pr-title a { color: var(--text); text-decoration: none; }
        .pr-title a:hover { color: var(--accent); text-decoration: underline; }

        .pr-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag {
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .tag.draft { color: var(--warning); border-color: var(--warning); }
        .tag.failure { color: var(--failure); border-color: var(--failure); }
        .tag.changes { color: var(--warning); border-color: var(--warning); }
        .tag.discuss { color: var(--accent); border-color: var(--accent); background: rgba(88, 166, 255, 0.1); }

        .pr-meta { color: var(--text-muted); font-size: 0.85em; margin-top: 8px; }
        .pr-meta span { margin-right: 16px; }
        .pr-meta .repo { color: var(--accent); }

        .repo-section { margin-bottom: 30px; }
        .repo-section h3 {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: var(--accent);
            padding-left: 12px;
            border-left: 3px solid var(--accent);
        }

        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9em;
        }
        footer a { color: var(--accent); text-decoration: none; }

        .loading, .error { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .error { color: var(--failure); }

        @media (max-width: 768px) {
            body { padding: 12px; }
            header { padding: 24px 0; margin-bottom: 20px; }
            header h1 { font-size: 1.5em; }
            header p { font-size: 0.95em; }
            .stat-card { padding: 16px; }
            .stat-card .number { font-size: 2em; }
            .stat-card .label { font-size: 0.75em; }
            .section h2 { font-size: 1.2em; margin-bottom: 12px; }
            .repo-section h3 { font-size: 1em; padding-left: 8px; }
            .pr-card { padding: 14px; flex-direction: column; gap: 10px; }
            .pr-card .status-icon { font-size: 1.3em; margin-top: 0; }
            .pr-header { flex-direction: column; align-items: flex-start; gap: 6px; }
            .pr-number { font-size: 0.8em; }
            .pr-title { font-size: 1em; white-space: normal; line-height: 1.5; }
            .tag { font-size: 0.7em; padding: 2px 8px; }
            .pr-meta { font-size: 0.75em; display: flex; flex-wrap: wrap; gap: 4px; }
            .pr-meta span { margin-right: 8px; }
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            header { padding: 10px 0 12px 0; margin-bottom: 10px; }
            header h1 { font-size: 1.1em; }
            header p { font-size: 0.75em; margin-top: 4px; }
            .stats { display: flex; gap: 6px; margin-bottom: 12px; }
            .stat-card { flex: 1; padding: 6px 4px; border-radius: 6px; }
            .stat-card .number { font-size: 1.3em; margin-bottom: 2px; }
            .stat-card .label { font-size: 0.55em; letter-spacing: 0.3px; }
            .section { margin-bottom: 16px; }
            .section h2 { font-size: 0.9em; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
            .section h2 .badge { font-size: 0.6em; padding: 2px 6px; }
            .repo-section { margin-bottom: 12px; }
            .repo-section h3 { font-size: 0.8em; padding-left: 6px; margin-bottom: 6px; }
            .pr-card { padding: 8px 10px; border-radius: 6px; gap: 0; flex-direction: row; align-items: center; }
            .pr-card .status-icon { display: none; }
            .pr-content { flex: 1; min-width: 0; }
            .pr-header { flex-direction: row; align-items: center; gap: 0; margin-bottom: 0; flex-wrap: nowrap; }
            .pr-number { font-size: 0.68em; padding: 0 4px; border-radius: 3px; flex-shrink: 0; margin-right: 6px; }
            .pr-title { font-size: 0.82em; font-weight: 500; line-height: 1.4; white-space: normal; word-break: break-word; }
            .pr-tags { display: inline; margin-left: 4px; gap: 2px; }
            .tag { font-size: 0.55em; padding: 1px 4px; border-radius: 8px; letter-spacing: 0.2px; }
            .pr-meta { font-size: 0.62em; margin-top: 3px; line-height: 1.3; }
            .pr-meta span { margin-right: 8px; }
            footer { padding: 12px 0; font-size: 0.65em; margin-top: 8px; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .pr-card { padding: 18px; }
            .pr-title { font-size: 1em; }
        }
        @media (min-width: 1440px) {
            .container { max-width: 1400px; }
            .stats { grid-template-columns: repeat(3, 1fr); }
        }
        html, body { overflow-x: hidden; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Apache Flink PR Todo</h1>
            <p>Open PRs requiring action by <a href="https://github.com/featzhang" target="_blank">@FeatZhang</a></p>
        </header>

        <div id="loading" class="loading">Loading PR data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="content" style="display: none;"></div>
    </div>

    <script>
        // 展示配置：所有展示信息由页面控制，而非数据文件
        const UI_CONFIG = {
            status: {
                'ci-failure': { icon: '❌', tagClass: 'failure', tagLabel: 'CI FAILURE', cardClass: 'failure' },
                'changes-requested': { icon: '🔄', tagClass: 'changes', tagLabel: 'CHANGES REQUESTED', cardClass: 'changes' }
            },
            draftTag: { tagClass: 'draft', tagLabel: 'DRAFT' }
        };

        async function loadPRData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            try {
                const response = await fetch('pr-data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                renderPage(data);
                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (e) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Failed to load PR data: ' + e.message;
            }
        }

        function renderPage(data) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            // 计算统计数据
            const stats = computeStats(data.repositories);

            // 渲染统计
            content.innerHTML += renderStats(stats);

            // 构建展示分组（数据层无 section 概念）
            const section = buildActionRequiredSection(data.repositories);
            content.innerHTML += renderSection(section);

            // 渲染页脚
            content.innerHTML += renderFooter(data.lastUpdated);
        }

        function computeStats(repos) {
            let totalOpen = 0;
            let actionRequired = 0;
            repos.forEach(repo => {
                totalOpen += repo.pullRequests.length;
                actionRequired += repo.pullRequests.length;
            });
            return {
                totalOpen: totalOpen,
                actionRequired: actionRequired,
                ciSuccess: Math.max(0, totalOpen - actionRequired)
            };
        }

        function buildActionRequiredSection(repos) {
            const groups = repos.map(repo => ({
                repoName: repo.name,
                repoUrl: repo.url,
                prs: repo.pullRequests
            }));
            const total = groups.reduce((sum, g) => sum + g.prs.length, 0);
            return {
                title: 'Action Required',
                badge: total,
                groups: groups
            };
        }

        function renderStats(stats) {
            return `
                <div class="stats">
                    <div class="stat-card open">
                        <div class="number">${stats.totalOpen}</div>
                        <div class="label">Open PRs</div>
                    </div>
                    <div class="stat-card action">
                        <div class="number">${stats.actionRequired}</div>
                        <div class="label">Action Required</div>
                    </div>
                    <div class="stat-card success">
                        <div class="number">${stats.ciSuccess}</div>
                        <div class="label">CI Success</div>
                    </div>
                </div>
            `;
        }

        function renderSection(section) {
            const groupsHtml = section.groups.map(group => renderGroup(group)).join('');
            return `
                <div class="section">
                    <h2>
                        ${section.title}
                        <span class="badge">${section.badge}</span>
                    </h2>
                    ${groupsHtml}
                </div>
            `;
        }

        function renderGroup(group) {
            const prsHtml = group.prs.map(pr => renderPRCard(pr, group.repoName)).join('');
            return `
                <div class="repo-section">
                    <h3>${group.repoName}</h3>
                    <div class="pr-grid">
                        ${prsHtml}
                    </div>
                </div>
            `;
        }

        function renderPRCard(pr, repoName) {
            const config = UI_CONFIG.status[pr.status] || UI_CONFIG.status['ci-failure'];
            const tagsHtml = buildTags(pr, config).map(t => `<span class="tag ${t.class}">${t.label}</span>`).join('');

            return `
                <div class="pr-card ${config.cardClass}">
                    <div class="status-icon">${config.icon}</div>
                    <div class="pr-content">
                        <div class="pr-header">
                            <span class="pr-number">#${pr.number}</span>
                            <span class="pr-title"><a href="${pr.url}" target="_blank">[${pr.issueId}][${pr.module}] ${pr.title}</a></span>
                        </div>
                        <div class="pr-tags">
                            ${tagsHtml}
                        </div>
                        <div class="pr-meta">
                            <span class="repo">${repoName}</span>
                            <span>Updated: ${pr.updatedAt}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function buildTags(pr, config) {
            const tags = [];
            if (pr.isDraft) {
                tags.push({ class: UI_CONFIG.draftTag.tagClass, label: UI_CONFIG.draftTag.tagLabel });
            }
            // Show discussions count if present
            if (pr.discussions && pr.discussions > 0) {
                tags.push({ class: 'discuss', label: `💬 ${pr.discussions}` });
            }
            // Show flip tags (pending actions)
            if (pr.flips && pr.flips.length > 0) {
                pr.flips.forEach(flip => {
                    if (flip.startsWith('discussions:')) {
                        // Already shown above as discuss tag
                    } else if (flip.startsWith('gha-fail:')) {
                        tags.push({ class: 'failure', label: `⚠️ ${flip.replace('gha-fail:', '')}` });
                    } else if (flip === 'ci-failure') {
                        tags.push({ class: config.tagClass, label: config.tagLabel });
                    } else if (flip === 'changes-requested') {
                        tags.push({ class: 'changes', label: 'CHANGES' });
                    } else {
                        tags.push({ class: 'warning', label: flip });
                    }
                });
            } else {
                // Default status tag if no flips
                tags.push({ class: config.tagClass, label: config.tagLabel });
            }
            return tags;
        }

        function renderFooter(lastUpdated) {
            return `
                <footer>
                    <p>Last updated: ${lastUpdated}</p>
                    <p>Auto-generated by flink-pr-todo skill</p>
                </footer>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadPRData);
    </script>
</body>
</html>
