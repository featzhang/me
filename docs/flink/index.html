<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flink Todo - FeatZhang</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --failure: #f85149;
            --success: #3fb950;
            --warning: #d29922;
            --tag-bg: #21262d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent), #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: var(--text-muted); font-size: 1.1em; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .stat-card .number { font-size: 2.5em; font-weight: bold; margin-bottom: 8px; }
        .stat-card.open .number { color: var(--accent); }
        .stat-card.action .number { color: var(--failure); }
        .stat-card.success .number { color: var(--success); }
        .stat-card .label { color: var(--text-muted); font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }

        .section { margin-bottom: 40px; }
        .section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section h2 .badge {
            background: var(--failure);
            color: white;
            font-size: 0.6em;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .pr-grid { display: grid; gap: 16px; }

        .pr-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
        }
        .pr-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(88, 166, 255, 0.1); }

        .pr-card .status-icon {
            font-size: 1.5em;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .pr-card.failure .status-icon { color: var(--failure); }
        .pr-card.changes .status-icon { color: var(--warning); }

        .pr-content { flex: 1; min-width: 0; }

        .pr-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .pr-number {
            font-family: 'SF Mono', Monaco, Inconsolata, 'Fira Code', monospace;
            font-size: 0.85em;
            background: var(--tag-bg);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent);
        }
        .pr-title {
            font-size: 1.1em;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pr-title a { color: var(--text); text-decoration: none; }
        .pr-title a:hover { color: var(--accent); text-decoration: underline; }

        .pr-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .tag {
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 12px;
            background: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .tag.draft { color: var(--warning); border-color: var(--warning); }
        .tag.failure { color: var(--failure); border-color: var(--failure); }
        .tag.changes { color: var(--warning); border-color: var(--warning); }
        .tag.discuss { color: var(--accent); border-color: var(--accent); background: rgba(88, 166, 255, 0.1); }

        .pr-meta { color: var(--text-muted); font-size: 0.85em; margin-top: 8px; }
        .pr-meta span { margin-right: 16px; }
        .pr-meta .repo { color: var(--accent); }

        .repo-section { margin-bottom: 30px; }
        .repo-section h3 {
            font-size: 1.2em;
            margin-bottom: 16px;
            color: var(--accent);
            padding-left: 12px;
            border-left: 3px solid var(--accent);
        }

        .discuss-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
        }
        .discuss-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(88, 166, 255, 0.1); }
        .discuss-icon {
            font-size: 1.5em;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .discuss-content { flex: 1; min-width: 0; }
        .discuss-subject {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .discuss-subject a { color: var(--text); text-decoration: none; }
        .discuss-subject a:hover { color: var(--accent); text-decoration: underline; }
        .discuss-meta { color: var(--text-muted); font-size: 0.85em; }
        .discuss-meta span { margin-right: 16px; }
        .discuss-meta .replies { color: var(--accent); }
        .discuss-grid { display: grid; gap: 16px; }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-label {
            color: var(--text-muted);
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
        }
        .filter-btn {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--tag-bg);
            color: var(--text-muted);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .filter-btn.active:hover {
            background: #4a9eff;
        }
        .filter-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }
        .search-group {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 180px;
            max-width: 320px;
        }
        .search-input {
            width: 100%;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85em;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9em;
        }
        footer a { color: var(--accent); text-decoration: none; }

        .loading, .error { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .error { color: var(--failure); }

        .ci-line {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 8px;
            font-size: 0.8em;
        }
        .ci-status {
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85em;
        }
        .ci-status.ci-success {
            color: #2e7d32;
            background: rgba(46, 125, 50, 0.1);
        }
        .ci-status.ci-failure {
            color: #c62828;
            background: rgba(198, 40, 40, 0.1);
        }
        .ci-status.ci-pending {
            color: #f9a825;
            background: rgba(249, 168, 37, 0.1);
        }
        .discuss-count {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.85em;
        }
        .pr-card.need-follow {
            border-left: 4px solid #ff5252;
        }
        .tag.discuss {
            background: rgba(77, 171, 247, 0.2);
            color: #4dabf7;
            font-weight: 600;
        }
        .tag.changes {
            background: rgba(255, 183, 77, 0.2);
            color: #ffb74d;
            font-weight: 600;
        }

        .tab-nav {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            margin-bottom: -1px;
            position: relative;
            z-index: 999;
        }
        .tab-btn {
            flex: 1;
            padding: 18px 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }
        .tab-btn:hover {
            color: var(--accent);
            background: rgba(88, 166, 255, 0.075);
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: linear-gradient(to bottom, rgba(88, 166, 255, 0.175), transparent);
        }
        .tab-indicator {
            font-size: 0.875em;
            background: var(--failure);
            color: white;
            border-radius: 5555px;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: 700;
        }
        .tab-btn:nth-child(1) .tab-indicator { background: #388e3c; } /* PR总数绿色 */
        .tab-btn:nth-child(2) .tab-indicator { background: var(--failure); } /* Action红色 */
        .tab-btn:nth-child(3) .tab-indicator { background: #2196f3; } /* 讨论蓝色 */
        
        .tab-pane {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0 0 12px 12px;
            padding: 36px 32px;
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.428);
        }
        @media (max-width: 540px) {
            .tab-btn { padding: 13px 16px; font-size: 0.89em; }
            .tab-pane { padding: 21px 18px; }
        }
        @media (max-width: 375px) {
            .tab-btn { padding: 9px 8px; font-size: 0.78em; }
            .tab-pane { padding: 14px 8px; }
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            header { padding: 24px 0; margin-bottom: 20px; }
            header h1 { font-size: 1.5em; }
            header p { font-size: 0.95em; }
            .stat-card { padding: 16px; }
            .stat-card .number { font-size: 2em; }
            .stat-card .label { font-size: 0.75em; }
            .section h2 { font-size: 1.2em; margin-bottom: 12px; }
            .repo-section h3 { font-size: 1em; padding-left: 8px; }
            .pr-card { padding: 14px; flex-direction: column; gap: 10px; }
            .pr-card .status-icon { font-size: 1.3em; margin-top: 0; }
            .pr-header { flex-direction: column; align-items: flex-start; gap: 6px; }
            .pr-number { font-size: 0.8em; }
            .pr-title { font-size: 1em; white-space: normal; line-height: 1.5; }
            .tag { font-size: 0.7em; padding: 2px 8px; }
            .pr-meta { font-size: 0.75em; display: flex; flex-wrap: wrap; gap: 4px; }
            .pr-meta span { margin-right: 8px; }
            .filter-bar { padding: 12px; gap: 12px; }
            .filter-divider { display: none; }
            .search-group { min-width: 100%; max-width: none; margin-top: 4px; }
            .search-input { font-size: 0.9em; padding: 8px 12px; }
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            header { padding: 10px 0 12px 0; margin-bottom: 10px; }
            header h1 { font-size: 1.1em; }
            header p { font-size: 0.75em; margin-top: 4px; }
            .stats { display: flex; gap: 6px; margin-bottom: 12px; }
            .stat-card { flex: 1; padding: 6px 4px; border-radius: 6px; }
            .stat-card .number { font-size: 1.3em; margin-bottom: 2px; }
            .stat-card .label { font-size: 0.55em; letter-spacing: 0.3px; }
            .section { margin-bottom: 16px; }
            .section h2 { font-size: 0.9em; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
            .section h2 .badge { font-size: 0.6em; padding: 2px 6px; }
            .repo-section { margin-bottom: 12px; }
            .repo-section h3 { font-size: 0.8em; padding-left: 6px; margin-bottom: 6px; }
            .pr-card { padding: 8px 10px; border-radius: 6px; gap: 0; flex-direction: row; align-items: center; }
            .pr-card .status-icon { display: none; }
            .pr-content { flex: 1; min-width: 0; }
            .pr-header { flex-direction: row; align-items: center; gap: 0; margin-bottom: 0; flex-wrap: nowrap; }
            .pr-number { font-size: 0.68em; padding: 0 4px; border-radius: 3px; flex-shrink: 0; margin-right: 6px; }
            .pr-title { font-size: 0.82em; font-weight: 500; line-height: 1.4; white-space: normal; word-break: break-word; }
            .pr-tags { display: inline; margin-left: 4px; gap: 2px; }
            .tag { font-size: 0.55em; padding: 1px 4px; border-radius: 8px; letter-spacing: 0.2px; }
            .pr-meta { font-size: 0.62em; margin-top: 3px; line-height: 1.3; }
            .pr-meta span { margin-right: 8px; }
            footer { padding: 12px 0; font-size: 0.65em; margin-top: 8px; }
            .filter-bar { padding: 8px; gap: 8px; }
            .filter-label { display: none; }
            .filter-btn { padding: 4px 10px; font-size: 0.7em; }
            .search-group { min-width: 100%; max-width: none; margin-top: 2px; }
            .search-input { font-size: 0.75em; padding: 6px 10px; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .pr-card { padding: 18px; }
            .pr-title { font-size: 1em; }
        }
        @media (min-width: 1440px) {
            .container { max-width: 1400px; }
            .stats { grid-template-columns: repeat(3, 1fr); }
        }
        html, body { overflow-x: hidden; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Apache Flink Todo</h1>
            <p>Open PRs &amp; mailing-list discussions for <a href="https://github.com/featzhang" target="_blank">@FeatZhang</a></p>
        </header>

        <div id="loading" class="loading">Loading todo data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="content" style="display: none;">
            <div id="filter-bar" class="filter-bar"></div>
        </div>
    </div>

    <script>
        // 全局数据缓存和筛选状态
        let globalData = null;
        let activeFilter = {
            type: 'follow',
            prStatus: 'all',
            followUp: 'all',
            searchKeyword: ''
        };

        function needFollowUp(pr) {
            return pr.status === 'ci-failure' || pr.status === 'changes-requested';
        }

        // 展示配置：所有展示信息由页面控制，而非数据文件
        const UI_CONFIG = {
            status: {
                'ci-failure': { icon: '❌', tagClass: 'failure', tagLabel: 'CI FAILURE', cardClass: 'failure' },
                'changes-requested': { icon: '🔄', tagClass: 'changes', tagLabel: 'CHANGES REQUESTED', cardClass: 'changes' },
                'success': { icon: '✅', tagClass: 'success', tagLabel: 'CI SUCCESS', cardClass: 'success' }
            },
            draftTag: { tagClass: 'draft', tagLabel: 'DRAFT' }
        };

        async function loadPRData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            try {
                const response = await fetch('todo-data.json?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const data = await response.json();
                renderPage(data);
                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (e) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Failed to load todo data: ' + e.message;
            }
        }

        function renderPage(data) {
            globalData = data;
            applyFilter();
        }

        function applyFilter() {
            const content = document.getElementById('content');
            content.innerHTML = '';

            // 计算Tab的数量徽章
            const totalPRs = globalData.repositories.reduce((sum, r) => sum + r.pullRequests.length, 0);
            const needFollowCount = globalData.repositories.reduce((sum, r) =>
                sum + r.pullRequests.filter(pr => needFollowUp(pr)).length, 0);
            const discussCount = (globalData.discussions || []).length;

            // 渲染Tab导航栏
            content.innerHTML += renderTabNav(totalPRs, needFollowCount, discussCount);

            // Tab内容区域
            let tabContent = '';

            if (activeFilter.type === 'pr' || activeFilter.type === 'follow') {
                // 保留筛选器和搜索（仅PR相关tab显示）
                tabContent += renderFilterBar();

                let filteredRepos = getFilteredRepos(globalData.repositories);

                // Follow Up Tab 自动应用需要跟进过滤
                if (activeFilter.type === 'follow') {
                    filteredRepos = filteredRepos.map(repo => ({
                        ...repo,
                        pullRequests: repo.pullRequests.filter(pr => needFollowUp(pr))
                    })).filter(repo => repo.pullRequests.length > 0);
                }

                if (filteredRepos.length > 0) {
                    const stats = computeStats(filteredRepos);
                    tabContent += renderStats(stats);

                    const section = buildActionRequiredSection(filteredRepos);
                    if (section.groups.length > 0) {
                        tabContent += renderSection(section);
                    }
                } else {
                    tabContent += '<div class="loading">No PRs match the current filters.</div>';
                }
            } else if (activeFilter.type === 'discuss') {
                if (globalData.discussions && globalData.discussions.length > 0) {
                    tabContent += renderDiscussionsSection(globalData.discussions);
                } else {
                    tabContent += '<div class="loading">No community discussions available.</div>';
                }
            }

            content.innerHTML += `<div class="tab-pane">${tabContent}</div>`;
            content.innerHTML += renderFooter(globalData.lastUpdated);
            bindTabEvents();
            bindFilterEvents();

            // Re-focus search input after re-render to keep typing continuity
            const searchInput = document.getElementById('pr-search');
            if (searchInput && activeFilter.searchKeyword) {
                searchInput.focus();
                const len = searchInput.value.length;
                searchInput.setSelectionRange(len, len);
            }
        }

        function getFilteredRepos(repos) {
            const statusFilter = activeFilter.prStatus;
            const followUpFilter = activeFilter.followUp;
            const keyword = activeFilter.searchKeyword.trim().toLowerCase();
            const result = repos.map(repo => ({
                ...repo,
                pullRequests: repo.pullRequests.filter(pr => {
                    // Status filter
                    if (statusFilter !== 'all') {
                        if (statusFilter === 'draft') {
                            if (!pr.isDraft) return false;
                        } else if (pr.status !== statusFilter) {
                            return false;
                        }
                    }
                    // Follow-up filter
                    if (followUpFilter !== 'all') {
                        const needsFollow = needFollowUp(pr);
                        if (followUpFilter === 'need-follow' && !needsFollow) return false;
                        if (followUpFilter === 'no-follow' && needsFollow) return false;
                    }
                    // Keyword search (filter)
                    if (keyword) {
                        const searchText = (pr.title + ' ' + pr.issueId + ' #' + pr.number).toLowerCase();
                        if (!searchText.includes(keyword)) return false;
                    }
                    return true;
                })
            })).filter(repo => repo.pullRequests.length > 0);
            return result;
        }

        function renderFilterBar() {
            const statusBtns = [
                { key: 'all', label: 'All' },
                { key: 'ci-failure', label: '❌ CI Failure' },
                { key: 'changes-requested', label: '🔄 Changes' },
                { key: 'draft', label: '📝 Draft' },
                { key: 'success', label: '✅ Success' }
            ];

            // Follow Up 筛选仅在 All PRs Tab 显示（Need Follow Tab 本身已过滤）
            const showFollowFilter = activeFilter.type === 'pr';
            const followUpBtns = [
                { key: 'all', label: 'All' },
                { key: 'need-follow', label: '🔔 Need Follow' },
                { key: 'no-follow', label: '✅ OK' }
            ];

            const followUpGroup = showFollowFilter ? `
                <div class="filter-divider"></div>
                <div class="filter-group">
                    <span class="filter-label">Follow Up:</span>
                    ${followUpBtns.map(btn => `<button class="filter-btn ${activeFilter.followUp === btn.key ? 'active' : ''}" data-filter="followUp" data-value="${btn.key}">${btn.label}</button>`).join('')}
                </div>
            ` : '';

            return `
                <div class="filter-bar" id="filter-bar">
                    <div class="filter-group">
                        <span class="filter-label">PR Status:</span>
                        ${statusBtns.map(btn => `<button class="filter-btn ${activeFilter.prStatus === btn.key ? 'active' : ''}" data-filter="status" data-value="${btn.key}">${btn.label}</button>`).join('')}
                    </div>
                    ${followUpGroup}
                    <div class="filter-divider"></div>
                    <div class="search-group">
                        <input type="text" class="search-input" id="pr-search" placeholder="🔍 Search by title, issue ID..." value="${activeFilter.searchKeyword}">
                    </div>
                </div>
            `;
        }

        function renderTabNav(totalPRs, needFollowCount, discussCount) {
            const tabs = [
                { key: 'pr', label: '🔧 All PRs', count: totalPRs },
                { key: 'follow', label: '🔔 Need Follow', count: needFollowCount },
                { key: 'discuss', label: '💬 Discussions', count: discussCount }
            ];
            return `
                <div class="tab-nav" id="tab-nav">
                    ${tabs.map(t => `
                        <button class="tab-btn ${activeFilter.type === t.key ? 'active' : ''}" data-tab="${t.key}">
                            ${t.label}
                            <span class="tab-indicator">${t.count}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function bindTabEvents() {
            document.querySelectorAll('#tab-nav .tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    activeFilter.type = this.dataset.tab;
                    applyFilter();
                });
            });
        }

        function bindFilterEvents() {
            document.querySelectorAll('#filter-bar .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const filterType = this.dataset.filter;
                    const filterValue = this.dataset.value;

                    if (filterType === 'status') {
                        activeFilter.prStatus = filterValue;
                    } else if (filterType === 'followUp') {
                        activeFilter.followUp = filterValue;
                    }
                    applyFilter();
                });
            });

            // Search input with debounce
            const searchInput = document.getElementById('pr-search');
            if (searchInput) {
                let debounceTimer;
                searchInput.addEventListener('input', function(e) {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        activeFilter.searchKeyword = e.target.value;
                        applyFilter();
                    }, 200);
                });
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        clearTimeout(debounceTimer);
                        activeFilter.searchKeyword = e.target.value;
                        applyFilter();
                    }
                });
            }
        }

        function computeStats(repos) {
            let totalOpen = 0;
            let actionRequired = 0;
            let ciSuccess = 0;
            repos.forEach(repo => {
                totalOpen += repo.pullRequests.length;
                repo.pullRequests.forEach(pr => {
                    if (pr.status === 'success') {
                        ciSuccess++;
                    } else {
                        actionRequired++;
                    }
                });
            });
            return {
                totalOpen: totalOpen,
                actionRequired: actionRequired,
                ciSuccess: ciSuccess
            };
        }

        function buildActionRequiredSection(repos) {
            const groups = repos.map(repo => ({
                repoName: repo.name,
                repoUrl: repo.url,
                prs: repo.pullRequests
            }));
            const total = groups.reduce((sum, g) => sum + g.prs.length, 0);
            return {
                title: 'Action Required',
                badge: total,
                groups: groups
            };
        }

        function renderStats(stats) {
            return `
                <div class="stats">
                    <div class="stat-card open">
                        <div class="number">${stats.totalOpen}</div>
                        <div class="label">Open PRs</div>
                    </div>
                    <div class="stat-card action">
                        <div class="number">${stats.actionRequired}</div>
                        <div class="label">Action Required</div>
                    </div>
                    <div class="stat-card success">
                        <div class="number">${stats.ciSuccess}</div>
                        <div class="label">CI Success</div>
                    </div>
                </div>
            `;
        }

        function renderSection(section) {
            const groupsHtml = section.groups.map(group => renderGroup(group)).join('');
            return `
                <div class="section">
                    <h2>
                        ${section.title}
                        <span class="badge">${section.badge}</span>
                    </h2>
                    ${groupsHtml}
                </div>
            `;
        }

        function renderGroup(group) {
            if (group.prs.length === 0) return '';
            const prsHtml = group.prs.map(pr => renderPRCard(pr, group.repoName)).join('');
            return `
                <div class="repo-section">
                    <h3>${group.repoName}</h3>
                    <div class="pr-grid">
                        ${prsHtml}
                    </div>
                </div>
            `;
        }

        function renderPRCard(pr, repoName) {
            const config = UI_CONFIG.status[pr.status] || UI_CONFIG.status['ci-failure'];
            const tagsHtml = buildTags(pr, config).map(t => `<span class="tag ${t.class}">${t.label}</span>`).join('');

            // CI Pipeline status indicator
            let ciIndicator = '';
            if (pr.azureStatus) {
                const ciClass = pr.azureStatus === 'SUCCESS' ? 'ci-success' : (pr.azureStatus === 'FAILURE' ? 'ci-failure' : 'ci-pending');
                const ciIcon = pr.azureStatus === 'SUCCESS' ? '✅' : (pr.azureStatus === 'FAILURE' ? '❌' : '🔄');
                const ciText = pr.azureStatus === 'SUCCESS' ? 'PASSED' : (pr.azureStatus === 'FAILURE' ? 'FAILED' : pr.azureStatus);
                ciIndicator = `<span class="ci-status ${ciClass}">${ciIcon} CI ${ciText}</span>`;
            }

            // Discussion count
            let discussIndicator = '';
            if (pr.discussions > 0 || (pr.flips && pr.flips.some(f => f.startsWith('discussions:')))) {
                const discCount = pr.discussions > 0 ? pr.discussions : (pr.flips.find(f => f.startsWith('discussions:')) || '').replace('discussions:', '');
                discussIndicator = `<span class="discuss-count">💬 ${discCount} comments</span>`;
            }

            // Follow-up indicator
            const needsFollow = needFollowUp(pr);
            const followIcon = needsFollow ? '🔔' : '';
            const followClass = needsFollow ? 'need-follow' : '';

            // Calculate creation time from PR number or fall back to updatedAt
            const createdAt = pr.createdAt || pr.updatedAt;

            return `
                <div class="pr-card ${config.cardClass} ${followClass}">
                    <div class="status-icon">${followIcon || config.icon}</div>
                    <div class="pr-content">
                        <div class="pr-header">
                            <span class="pr-number">#${pr.number}</span>
                            <span class="pr-title"><a href="${pr.url}" target="_blank">[${pr.issueId}][${pr.module}] ${pr.title}</a></span>
                        </div>
                        <div class="pr-tags">
                            ${tagsHtml}
                        </div>
                        <div class="ci-line">
                            ${ciIndicator}
                            ${discussIndicator}
                        </div>
                        <div class="pr-meta">
                            <span class="repo">${repoName}</span>
                            <span>📅 ${createdAt}</span>
                            <span>📝 Updated: ${pr.updatedAt}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function buildTags(pr, config) {
            const tags = [];
            if (pr.isDraft) {
                tags.push({ class: UI_CONFIG.draftTag.tagClass, label: UI_CONFIG.draftTag.tagLabel });
            }
            // Show pending discussions/comments count if present
            if (pr.flips && pr.flips.length > 0) {
                pr.flips.forEach(flip => {
                    if (flip.startsWith('discussions:')) {
                        const count = flip.replace('discussions:', '');
                        tags.push({ class: 'discuss', label: `💬 ${count}` });
                    } else if (flip.startsWith('gha-fail:')) {
                        tags.push({ class: 'failure', label: `⚠️ ${flip.replace('gha-fail:', '')}` });
                    } else if (flip === 'ci-failure') {
                        tags.push({ class: config.tagClass, label: config.tagLabel });
                    } else if (flip === 'changes-requested') {
                        tags.push({ class: 'changes', label: '🔄 CHANGES' });
                    } else {
                        tags.push({ class: 'warning', label: flip });
                    }
                });
            } else {
                // Default status tag if no flips
                tags.push({ class: config.tagClass, label: config.tagLabel });
            }
            return tags;
        }

        function renderDiscussionsSection(discussions) {
            const cardsHtml = discussions.map(d => renderDiscussCard(d)).join('');
            return `
                <div class="section">
                    <h2>
                        💬 Community Discussions
                        <span class="badge">${discussions.length}</span>
                    </h2>
                    <div class="discuss-grid">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function renderDiscussCard(discuss) {
            const repliesText = discuss.replies > 0 ? `${discuss.replies} replies` : 'No replies yet';
            const roleBadge = discuss.role === 'starter'
                ? '<span class="tag discuss">🆕 STARTED</span>'
                : (discuss.role === 'participant'
                    ? '<span class="tag changes">💬 PARTICIPATED</span>'
                    : '');
            return `
                <div class="discuss-card">
                    <div class="discuss-icon">${discuss.role === 'starter' ? '🆕' : '💬'}</div>
                    <div class="discuss-content">
                        <div class="discuss-subject">
                            <a href="${discuss.url}" target="_blank">${discuss.subject}</a>
                        </div>
                        <div class="pr-tags" style="margin: 6px 0;">
                            ${roleBadge}
                        </div>
                        <div class="discuss-meta">
                            <span>📅 ${discuss.date}</span>
                            <span class="replies">💬 ${repliesText}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFooter(lastUpdated) {
            return `
                <footer>
                    <p>Last updated: ${lastUpdated}</p>
                    <p>Auto-generated by flink-pr-todo skill</p>
                </footer>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadPRData);
    </script>
</body>
</html>
